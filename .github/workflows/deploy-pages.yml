# Builds the Lovable (TanStack Start) site as static pages and publishes it to GitHub Pages.
# Runs on every push to main, so edits made in Lovable go live on aavyaglobex.com automatically.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Write static-site build config
        run: |
          cat > vite.pages.config.ts <<'EOF'
          import { defineConfig } from "@lovable.dev/vite-tanstack-config";

          export default defineConfig({
            tanstackStart: {
              server: { entry: "server" },
              // SPA shell (used for /admin and unknown URLs) is saved as 404.html
              spa: { enabled: true, maskPath: "/admin", prerender: { outputPath: "/404", crawlLinks: false } },
              // Pre-render every real page to plain HTML; skip files (PDFs etc.) and query/hash links
              prerender: {
                enabled: true,
                crawlLinks: true,
                filter: ({ path }: { path: string }) =>
                  !path.includes("?") && !path.includes("#") && !/\.[a-z0-9]+$/i.test(path),
              },
            },
          });
          EOF
      - name: Build
        run: npx vite build --config vite.pages.config.ts
      - name: Prepare output
        run: |
          rm -f .output/public/_headers
          touch .output/public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
